<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the logo -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Text shadow -->
    <filter id="textShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="30" cy="30" r="25" fill="url(#logoGradient)" filter="url(#glow)" opacity="0.9"/>
  
  <!-- Geometric craft symbol -->
  <g transform="translate(30,30)" fill="white" filter="url(#textShadow)">
    <!-- Diamond/crystal shape -->
    <polygon points="0,-15 12,0 0,15 -12,0" fill="white" opacity="0.9"/>
    <!-- Inner lines for craft detail -->
    <line x1="0" y1="-15" x2="0" y2="15" stroke="rgba(102,126,234,0.8)" stroke-width="2"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="rgba(102,126,234,0.8)" stroke-width="2"/>
    <!-- Small dots for detail -->
    <circle cx="0" cy="-7" r="1.5" fill="rgba(102,126,234,0.9)"/>
    <circle cx="0" cy="7" r="1.5" fill="rgba(102,126,234,0.9)"/>
    <circle cx="-6" cy="0" r="1.5" fill="rgba(102,126,234,0.9)"/>
    <circle cx="6" cy="0" r="1.5" fill="rgba(102,126,234,0.9)"/>
  </g>
  
  <!-- ExusCraft text -->
  <text x="70" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#logoGradient)" filter="url(#textShadow)">
    Exus
  </text>
  <text x="70" y="45" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#logoGradient)" filter="url(#textShadow)">
    Craft
  </text>
  
  <!-- Subtitle -->
  <text x="140" y="35" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.7)">
    MOD FORGE
  </text>
</svg>