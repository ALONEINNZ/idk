<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - ExusCraft</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <style>
        .profile-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            margin-top: 100px;
        }
        
        .profile-header {
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-primary));
            border-radius: var(--border-radius-lg);
            padding: 3rem;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
        }
        
        .profile-banner {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            opacity: 0.1;
        }
        
        .profile-info {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 2rem;
        }
        
        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
            border: 4px solid rgba(255, 255, 255, 0.2);
        }
        
        .profile-details h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .profile-meta {
            display: flex;
            gap: 2rem;
            margin: 1rem 0;
            flex-wrap: wrap;
        }
        
        .profile-stat {
            text-align: center;
        }
        
        .profile-stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-primary);
        }
        
        .profile-stat-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        
        .profile-badges {
            display: flex;
            gap: 0.5rem;
            margin: 1rem 0;
            flex-wrap: wrap;
        }
        
        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        
        .profile-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        .profile-tab {
            padding: 1rem 2rem;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }
        
        .profile-tab.active {
            color: var(--accent-primary);
            border-bottom-color: var(--accent-primary);
        }
        
        .profile-content {
            background: var(--bg-secondary);
            border-radius: var(--border-radius-lg);
            padding: 2rem;
        }
        
        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }
        
        .achievement-card {
            background: var(--bg-primary);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .achievement-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
        }
        
        .achievement-icon {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        
        .achievement-rarity {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        
        .rarity-common { background: rgba(156, 163, 175, 0.2); color: #9CA3AF; }
        .rarity-rare { background: rgba(59, 130, 246, 0.2); color: #3B82F6; }
        .rarity-epic { background: rgba(147, 51, 234, 0.2); color: #9333EA; }
        .rarity-legendary { background: rgba(245, 158, 11, 0.2); color: #F59E0B; }
        
        .mod-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        
        .mod-card {
            background: var(--bg-primary);
            border-radius: var(--border-radius);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .mod-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-heavy);
        }
        
        .mod-image {
            height: 160px;
            background: var(--gradient-primary);
            position: relative;
        }
        
        .mod-info {
            padding: 1.5rem;
        }
        
        .mod-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }
        
        .mod-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        
        .reviews-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .review-card {
            background: var(--bg-primary);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .review-rating {
            color: #fbbf24;
        }
        
        .collections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        
        .collection-card {
            background: var(--bg-primary);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .collection-mods {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        
        .collection-mod {
            width: 40px;
            height: 40px;
            border-radius: var(--border-radius);
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: white;
        }
        
        .edit-profile-btn {
            position: absolute;
            top: 2rem;
            right: 2rem;
            z-index: 3;
        }
        
        .follow-btn {
            margin-left: auto;
        }
        
        @media (max-width: 768px) {
            .profile-container {
                padding: 1rem;
            }
            
            .profile-info {
                flex-direction: column;
                text-align: center;
            }
            
            .profile-meta {
                justify-content: center;
            }
            
            .profile-tabs {
                overflow-x: auto;
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <a href="/">
                    <img src="logo-simple.svg" alt="ExusCraft" class="nav-logo">
                </a>
            </div>
            <div class="nav-menu">
                <a class="nav-link" href="/">Home</a>
                <a class="nav-link" href="/#games">Mods</a>
                <a class="nav-link" href="/profile.html">Profile</a>
            </div>
            <div class="nav-auth" id="navAuth">
                <button onclick="showLogin()" class="btn btn-outline">Login</button>
                <button onclick="showRegister()" class="btn btn-primary">Join Now</button>
            </div>
            <div class="nav-user" id="navUser" style="display: none;">
                <span id="username"></span>
                <button onclick="logout()" class="btn btn-outline">Logout</button>
            </div>
        </div>
    </nav>

    <div class="profile-container">
        <!-- Profile Header -->
        <div class="profile-header">
            <div class="profile-banner"></div>
            <button class="btn btn-outline edit-profile-btn" id="editProfileBtn" onclick="editProfile()" style="display: none;">
                <i class="fas fa-edit"></i> Edit Profile
            </button>
            <div class="profile-info">
                <div class="profile-avatar" id="profileAvatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="profile-details">
                    <h1 id="profileDisplayName">Loading...</h1>
                    <p id="profileBio" style="color: var(--text-secondary); margin-bottom: 1rem;"></p>
                    <div class="profile-badges" id="profileBadges"></div>
                    <div class="profile-meta">
                        <div class="profile-stat">
                            <div class="profile-stat-value" id="modsCreated">0</div>
                            <div class="profile-stat-label">Mods Created</div>
                        </div>
                        <div class="profile-stat">
                            <div class="profile-stat-value" id="totalDownloads">0</div>
                            <div class="profile-stat-label">Total Downloads</div>
                        </div>
                        <div class="profile-stat">
                            <div class="profile-stat-value" id="averageRating">0.0</div>
                            <div class="profile-stat-label">Average Rating</div>
                        </div>
                        <div class="profile-stat">
                            <div class="profile-stat-value" id="followersCount">0</div>
                            <div class="profile-stat-label">Followers</div>
                        </div>
                        <div class="profile-stat">
                            <div class="profile-stat-value" id="reputationScore">0</div>
                            <div class="profile-stat-label" id="reputationLevel">Newcomer</div>
                        </div>
                    </div>
                    <button class="btn btn-primary follow-btn" id="followBtn" onclick="toggleFollow()" style="display: none;">
                        <i class="fas fa-user-plus"></i> Follow
                    </button>
                </div>
            </div>
        </div>

        <!-- Profile Tabs -->
        <div class="profile-tabs">
            <button class="profile-tab active" onclick="showTab('overview')">Overview</button>
            <button class="profile-tab" onclick="showTab('mods')">Mods</button>
            <button class="profile-tab" onclick="showTab('reviews')">Reviews</button>
            <button class="profile-tab" onclick="showTab('achievements')">Achievements</button>
            <button class="profile-tab" onclick="showTab('collections')">Collections</button>
        </div>

        <!-- Profile Content -->
        <div class="profile-content">
            <!-- Overview Tab -->
            <div id="overviewTab" class="tab-content">
                <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;">
                    <div>
                        <h3 style="margin-bottom: 1rem;">Recent Activity</h3>
                        <div id="recentActivity"></div>
                    </div>
                    <div>
                        <h3 style="margin-bottom: 1rem;">Quick Stats</h3>
                        <div id="quickStats"></div>
                    </div>
                </div>
            </div>

            <!-- Mods Tab -->
            <div id="modsTab" class="tab-content" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                    <h3>Created Mods</h3>
                    <div>
                        <select id="modSort" onchange="sortMods()">
                            <option value="newest">Newest First</option>
                            <option value="oldest">Oldest First</option>
                            <option value="downloads">Most Downloaded</option>
                            <option value="rating">Highest Rated</option>
                        </select>
                    </div>
                </div>
                <div class="mod-grid" id="userMods"></div>
            </div>

            <!-- Reviews Tab -->
            <div id="reviewsTab" class="tab-content" style="display: none;">
                <h3 style="margin-bottom: 2rem;">Reviews Posted</h3>
                <div class="reviews-list" id="userReviews"></div>
            </div>

            <!-- Achievements Tab -->
            <div id="achievementsTab" class="tab-content" style="display: none;">
                <h3 style="margin-bottom: 2rem;">Achievements Unlocked</h3>
                <div class="achievements-grid" id="userAchievements"></div>
            </div>

            <!-- Collections Tab -->
            <div id="collectionsTab" class="tab-content" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                    <h3>Mod Collections</h3>
                    <button class="btn btn-primary" onclick="createCollection()" id="createCollectionBtn" style="display: none;">
                        <i class="fas fa-plus"></i> Create Collection
                    </button>
                </div>
                <div class="collections-grid" id="userCollections"></div>
            </div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div id="editProfileModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeEditProfile()">&times;</span>
            <h2>Edit Profile</h2>
            <form id="editProfileForm" onsubmit="saveProfile(event)">
                <div style="margin-bottom: 1.5rem;">
                    <label>Display Name</label>
                    <input type="text" id="editDisplayName" required>
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label>Bio</label>
                    <textarea id="editBio" rows="3" maxlength="500"></textarea>
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label>Location</label>
                    <input type="text" id="editLocation">
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label>Website</label>
                    <input type="url" id="editWebsite">
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label>Favorite Games (comma separated)</label>
                    <input type="text" id="editFavoriteGames">
                </div>
                <button type="submit" class="btn btn-primary btn-full">Save Changes</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="profile.js"></script>
</body>
</html>
